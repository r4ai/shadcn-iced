# Keeps the pinned actions and the lockfiles up to date. `cooldown` waits a
# week after a release so that compromised versions are likely yanked first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        update-types: [minor, patch]

  # The reference of the conformance suite. Updates of `shadcn` itself come
  # from the weekly Conformance workflow (`pnpm shadcn:update`); a new
  # Playwright (Chromium) may move scores: re-record the baseline if so.
  - package-ecosystem: npm
    directory: /conformance
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      conformance:
        update-types: [minor, patch]

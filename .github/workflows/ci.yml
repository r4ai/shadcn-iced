name: CI

# The entry point of the checks: it runs the workflows of the parts that a
# pull request changes (every part on `main`), in parallel, and `Result`
# reports them all as the single required check of `main`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its previous run; `main` runs to
  # the end, to deploy the site of every commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      conformance: ${{ steps.filter.outputs.conformance }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          fi
          # `<output> <regex>`: whether a changed file matches (always on push).
          filter() {
            if [ "$EVENT" != pull_request ] || grep -qE "$2" <<< "$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi | tee -a "$GITHUB_OUTPUT"
          }
          shared='^(Cargo\.(toml|lock)|mise\.(toml|lock)|\.github/workflows/ci\.yml)$'
          filter rust "$shared|^(crates|examples|conformance/iced|scripts)/|^\.github/workflows/rust\.yml$"
          filter site "$shared|^(crates|examples|site)/|^\.github/workflows/site\.yml$"
          filter conformance "$shared|^(crates|conformance)/|^\.github/workflows/conformance\.yml$"
          filter lint "$shared|^(\.github|scripts)/"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml

  # Cloudflare Workers static assets (`site/wrangler.jsonc`). Needs the
  # CLOUDFLARE_API_TOKEN (with the "Edit Cloudflare Workers" permissions) and
  # CLOUDFLARE_ACCOUNT_ID secrets of the `production` environment, which only
  # `main` can deploy to. It lives here and not in `site.yml`: a called
  # workflow does not get the secrets of an environment.
  deploy:
    name: Deploy site
    needs: site
    if: github.event_name == 'push' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist
      - name: Check the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to the production environment to deploy the site."
            exit 1
          fi
      # No cache in the job that holds the secrets: what it runs comes from
      # the lockfile alone.
      - uses: ./.github/actions/setup-pnpm
        with:
          directory: site
          cache: false
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: deploy

  conformance:
    name: Conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/conformance.yml

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  # The required status check of `main`: it passes when every workflow that
  # ran passed, whichever of them the changes skipped.
  result:
    name: Result
    needs: [changes, rust, site, deploy, conformance, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<< "$RESULTS"

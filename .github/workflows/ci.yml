name: CI

# The entry point of the checks: it runs the workflows of the parts that a
# pull request changes (every part on `main`), in parallel, and `Result`
# reports them all as the single required check of `main`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its previous run; `main` runs to
  # the end, to deploy the site of every commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      conformance: ${{ steps.filter.outputs.conformance }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          fi
          # `<output> <regex>`: whether a changed file matches (always on push).
          filter() {
            if [ "$EVENT" != pull_request ] || grep -qE "$2" <<< "$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi | tee -a "$GITHUB_OUTPUT"
          }
          shared='^(Cargo\.(toml|lock)|mise\.(toml|lock)|\.github/workflows/ci\.yml)$'
          filter rust "$shared|^(crates|examples|conformance/iced|scripts)/|^\.github/workflows/rust\.yml$"
          filter site "$shared|^(crates|examples|site)/|^\.github/workflows/site\.yml$"
          filter conformance "$shared|^(crates|conformance)/|^\.github/workflows/conformance\.yml$"
          filter lint "$shared|^(\.github|scripts)/"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    with:
      deploy: ${{ github.event_name == 'push' }}

  conformance:
    name: Conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/conformance.yml

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  # The required status check of `main`: it passes when every workflow that
  # ran passed, whichever of them the changes skipped.
  result:
    name: Result
    needs: [changes, rust, site, conformance, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<< "$RESULTS"

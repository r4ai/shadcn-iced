name: Rust

# The checks of the Rust workspace, run by `ci.yml`. Every job runs in
# parallel; the jobs that build the gallery in the dev profile share a cache,
# saved on `main` only (pull requests restore it).

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller caches and faster builds; panics still say where.
  CARGO_PROFILE_DEV_DEBUG: "0"
  ICED_TEST_BACKEND: tiny-skia

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  snapshots:
    name: Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The cache of `test`, which builds the same crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
      - run: cargo run -p gallery --bin snapshot --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: target/snapshots/*-tiny-skia.png
          retention-days: 14

  copy:
    name: Copy components
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/check-copy.sh

  # What `release.yml` publishes: the crates must package, and the CLI must
  # build from its package alone (`scripts/prepare-publish.sh`).
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: ./scripts/prepare-publish.sh
      - run: cargo package --locked -p shadcn_iced_core -p shadcn-iced --no-verify
      # `--allow-dirty`: the copy of the components is not committed.
      - run: cargo package --locked --allow-dirty -p cargo-shadcn-iced

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Measure coverage and enforce thresholds
        run: |
          cargo llvm-cov \
            --package shadcn_iced_core \
            --package shadcn-iced \
            --package cargo-shadcn-iced \
            --locked \
            --no-report
          cargo llvm-cov report \
            --ignore-filename-regex "shadcn_iced_core|shadcn_iced/" \
            --fail-under-lines 90 \
            --summary-only
          cargo llvm-cov report \
            --ignore-filename-regex "components/|icon/|presets|font|anchored|animated_width|breakpoint|composition|dashed|disclosure|focus|keys|labelled|layer|listbox|otp|pressable|roving|scroll|split|tab|toaster|track|typeset|underline|wheel" \
            --fail-under-lines 85 \
            --summary-only
          {
            echo "## Coverage summary"
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Property tests with many more cases than `test` runs, in release.
  properties:
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROPTEST_CASES: "4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: properties
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo test --release --locked
          -p shadcn_iced_core -p shadcn-iced -p cargo-shadcn-iced -p shadcn_iced_verify

  # The proofs of Kani (`crates/verify`): the arithmetic of `math.rs`, for
  # every input, in a few minutes.
  kani:
    name: Kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The binaries of `cargo install`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kani
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Kani installs its own toolchain and CBMC (`cargo kani setup`).
      - name: Install Kani
        env:
          KANI_VERSION: "0.68.0"
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # The proofs run in parallel (`-j`), one per core.
      - name: Prove
        working-directory: crates/verify
        run: cargo kani -j "$(nproc)" --output-format terse

  # cargo-mutants (`.cargo/mutants.toml`): the tests must catch a change of
  # every function of the CLI, of the arithmetic of `math.rs` (tested through
  # `crates/verify`, which builds without `iced`, in seconds) and of the
  # functions of the components that compute. The mutants of the components
  # are shared among parallel jobs (`--shard`): each one builds `iced`.
  mutants:
    name: Mutation tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            shard: 0/1
            args: -p cargo-shadcn-iced
          - name: math
            shard: 0/1
            args: -p shadcn_iced_verify
          - name: components 1/4
            shard: 0/4
            args: >-
              -p shadcn-iced
              -f crates/shadcn_iced/src/components/calendar.rs
              -f crates/shadcn_iced/src/components/date_picker.rs
              -f crates/shadcn_iced/src/components/slider.rs
            # The functions that compute, not the views.
            filter: '\sin\s(navigation|next_focus|week_number|add_months|long_date|short_date|numeric_date|month_name|decimals|Slider<.*>::(snap|limits|moving|move_to|ratio))$'
          - name: components 2/4
            shard: 1/4
            args: >-
              -p shadcn-iced
              -f crates/shadcn_iced/src/components/calendar.rs
              -f crates/shadcn_iced/src/components/date_picker.rs
              -f crates/shadcn_iced/src/components/slider.rs
            # The functions that compute, not the views.
            filter: '\sin\s(navigation|next_focus|week_number|add_months|long_date|short_date|numeric_date|month_name|decimals|Slider<.*>::(snap|limits|moving|move_to|ratio))$'
          - name: components 3/4
            shard: 2/4
            args: >-
              -p shadcn-iced
              -f crates/shadcn_iced/src/components/calendar.rs
              -f crates/shadcn_iced/src/components/date_picker.rs
              -f crates/shadcn_iced/src/components/slider.rs
            # The functions that compute, not the views.
            filter: '\sin\s(navigation|next_focus|week_number|add_months|long_date|short_date|numeric_date|month_name|decimals|Slider<.*>::(snap|limits|moving|move_to|ratio))$'
          - name: components 4/4
            shard: 3/4
            args: >-
              -p shadcn-iced
              -f crates/shadcn_iced/src/components/calendar.rs
              -f crates/shadcn_iced/src/components/date_picker.rs
              -f crates/shadcn_iced/src/components/slider.rs
            # The functions that compute, not the views.
            filter: '\sin\s(navigation|next_focus|week_number|add_months|long_date|short_date|numeric_date|month_name|decimals|Slider<.*>::(snap|limits|moving|move_to|ratio))$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants-${{ matrix.shard == '0/1' && matrix.name || 'components' }}
          save-if: ${{ github.ref == 'refs/heads/main' && startsWith(matrix.shard, '0/') }}
      # cargo-mutants exits with 2 for missed mutants, 3 for timeouts (a
      # mutant that loops forever, caught by its timeout): the missed ones
      # fail the job, but the deleted fields of a style in the jobs of the
      # components, which `--re` does not filter out (cargo-mutants 27).
      - name: Run mutation tests
        env:
          ARGS: ${{ matrix.args }}
          SHARD: ${{ matrix.shard }}
          FILTER: ${{ matrix.filter }}
        run: |
          read -ra args <<< "$ARGS"
          allowed='^$'
          if [ -n "$FILTER" ]; then
            args+=(--re "$FILTER")
            allowed=': delete field '
          fi
          status=0
          cargo mutants "${args[@]}" --shard "$SHARD" --no-times --in-place -- --locked || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          if grep -v "$allowed" mutants.out/missed.txt; then
            echo "::error::Mutants survived the tests (above)."
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants.out
          retention-days: 14

name: Rust

# The checks of the Rust workspace, run by `ci.yml`. Every job runs in
# parallel; the jobs that build the gallery in the dev profile share a cache,
# saved on `main` only (pull requests restore it).

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller caches and faster builds; panics still say where.
  CARGO_PROFILE_DEV_DEBUG: "0"
  ICED_TEST_BACKEND: tiny-skia

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  snapshots:
    name: Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The cache of `test`, which builds the same crates.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: false
      - run: cargo run -p gallery --bin snapshot --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: target/snapshots/*-tiny-skia.png
          retention-days: 14

  copy:
    name: Copy components
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/check-copy.sh

  # What `release.yml` publishes: the crates must package, and the CLI must
  # build from its package alone (`scripts/prepare-publish.sh`).
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: ./scripts/prepare-publish.sh
      - run: cargo package --locked -p shadcn_iced_core -p shadcn-iced --no-verify
      # `--allow-dirty`: the copy of the components is not committed.
      - run: cargo package --locked --allow-dirty -p cargo-shadcn-iced

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Measure coverage and enforce thresholds
        run: |
          cargo llvm-cov \
            --package shadcn_iced_core \
            --package shadcn-iced \
            --package cargo-shadcn-iced \
            --locked \
            --no-report
          cargo llvm-cov report \
            --ignore-filename-regex "shadcn_iced_core|shadcn_iced/" \
            --fail-under-lines 90 \
            --summary-only
          cargo llvm-cov report \
            --ignore-filename-regex "components/|icon/|presets|font|anchored|animated_width|breakpoint|composition|dashed|disclosure|focus|keys|labelled|layer|listbox|otp|pressable|roving|scroll|split|tab|toaster|track|typeset|underline|wheel" \
            --fail-under-lines 85 \
            --summary-only
          {
            echo "## Coverage summary"
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutants:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run mutation tests
        run: cargo mutants -p cargo-shadcn-iced --no-times -- --locked

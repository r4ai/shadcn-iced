name: Preview

# Deletes the Worker Preview of the site of a pull request (`Preview site` of
# `ci.yml`) when the pull request closes.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Delete site preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          directory: site
          cache: false
      # A pull request without a preview (one that did not change the site)
      # has nothing to delete.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation

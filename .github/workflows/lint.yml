name: Lint

# The checks of the workflows and of the Python scripts, run by `ci.yml`. The
# tools come from `mise.toml`, checked against the checksums of `mise.lock`.

on:
  workflow_call:

permissions: {}

env:
  # Install only what `mise.lock` records, checked against its checksums.
  MISE_LOCKED: "true"

jobs:
  actions:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.12
          sha256: 72404716768b5b044cbd5170136d3d795cbd592658b6e932b66f0f8d67a54875
          install_args: actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact
      - name: actionlint
        run: actionlint
      # Every action is pinned to the commit of its version tag.
      - name: pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml --format=github .

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.12
          sha256: 72404716768b5b044cbd5170136d3d795cbd592658b6e932b66f0f8d67a54875
          install_args: uv
      # `uv.lock` is up to date with `pyproject.toml`, and every script
      # compiles with its locked dependencies.
      - run: uv lock --check --project scripts
      - run: uv run --locked --project scripts python -m compileall -q -x '/\.venv/' scripts

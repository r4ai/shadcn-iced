name: Lighthouse

# The performance of the site of a pull request against the one of `main`
# (`site/scripts/lighthouse.mjs`), run by `ci.yml` once `site.yml` built it.
# The site of `main` is the `site` artifact of its last successful run of
# `ci.yml`, measured in turns with the site of the pull request on the same
# runner. The report goes to the summary of the run and to a comment of the
# pull request, updated on each push. It reports and does not fail: the
# timings of a shared runner vary too much to gate a merge on them.

on:
  workflow_call:

permissions: {}

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The `site` artifact of `main`, from another run.
      actions: read
      # The comment.
      pull-requests: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          directory: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist
      - name: The site of main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId,headSha \
            --jq '.[0] | "\(.databaseId) \(.headSha)"')"
          read -r id sha <<< "$run"
          if [ -n "$id" ] && gh run download "$id" --repo "$REPO" --name site --dir ../base/dist; then
            echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No site of main to compare with: the report has the values of the pull request alone."
          fi
      # Google Chrome comes with the runner image.
      - name: Lighthouse
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/lighthouse.mjs --head dist --head-label "${HEAD_SHA:0:7}" \
            ${BASE_SHA:+--base ../base/dist --base-label "main@$BASE_SHA"} --out lighthouse
          cat lighthouse/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: site/lighthouse
          retention-days: 30
      # The comment that has the marker of the report (its first line), or a
      # new one. Pull requests from forks get a read-only token: their report
      # stays in the summary.
      - name: Comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="$(head -n 1 lighthouse/report.md)"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@lighthouse/report.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file lighthouse/report.md
          fi

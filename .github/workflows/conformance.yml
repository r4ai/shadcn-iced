name: Conformance

# Compares shadcn_iced with shadcn/ui (see conformance/README.md), run by
# `ci.yml`.
#
# The weekly run first updates shadcn/ui to its latest release (at least 7
# days old, `minimumReleaseAge`), so that it fails when shadcn/ui changed in a
# way shadcn_iced does not follow yet.

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      update:
        description: Update shadcn/ui to its latest release first
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          directory: conformance
      - run: pnpm typecheck
        working-directory: conformance

  compare:
    name: Compare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-pnpm
        with:
          directory: conformance
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Update shadcn/ui
        if: github.event_name == 'schedule' || inputs.update
        run: |
          pnpm shadcn:update
          pnpm typecheck
      - name: Render with shadcn_iced
        run: pnpm iced
      - name: Compare with shadcn/ui
        run: pnpm test
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          pnpm report
          # The scores of this run, to commit when the baseline should change.
          pnpm baseline
          cp baseline.json out/baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-report
          path: |
            conformance/out/report
            conformance/out/reference
            conformance/out/iced
            conformance/out/diff
            conformance/out/baseline.json
          retention-days: 14

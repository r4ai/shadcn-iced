[package]
name = "iced_ui_core"
description = "Theme tokens, fonts, icons and headless primitives for iced_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["lucide", "inter", "geist"]
# Bundles the Lucide icon font (~900 KB).
lucide = []
# Bundles the Inter font (`font-sans` of shadcn/ui's default style).
inter = []
# Bundles the Geist Mono font (`font-mono`).
geist = []

[dependencies]
iced.workspace = true

[lints]
workspace = true

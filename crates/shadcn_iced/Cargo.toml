[package]
name = "shadcn-iced"
description = "shadcn/ui components for iced"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["lucide", "geist", "symbols"]
# The fonts bundled by `shadcn_iced_core`: see its features.
lucide = ["shadcn_iced_core/lucide"]
geist = ["shadcn_iced_core/geist"]
inter = ["shadcn_iced_core/inter"]
symbols = ["shadcn_iced_core/symbols"]

[dependencies]
iced.workspace = true
shadcn_iced_core = { path = "../shadcn_iced_core", version = "0.2.0", default-features = false }

[lints]
workspace = true

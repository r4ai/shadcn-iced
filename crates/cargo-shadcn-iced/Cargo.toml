[package]
name = "cargo-shadcn-iced"
description = "Copy shadcn_iced components into your project, shadcn/ui style"
readme = "README.md"
keywords = ["shadcn", "iced", "cli", "cargo-subcommand", "components"]
categories = ["command-line-utilities", "development-tools::cargo-plugins", "gui"]
homepage = "https://shadcn-iced.r4ai.dev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# `components/` is the copy of the components of `shadcn_iced` that
# `scripts/prepare-publish.sh` makes for the published crate (see `build.rs`).
include = ["/build.rs", "/src", "/components/*.rs", "/README.md"]

[[bin]]
name = "cargo-shadcn-iced"
path = "src/main.rs"

[lints]
workspace = true

# The prebuilt binaries of the GitHub releases (`.github/workflows/release.yml`)
# for `cargo binstall cargo-shadcn-iced`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

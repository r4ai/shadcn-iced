# Supply-chain hardening of the dependencies of the conformance suite, like
# the site (https://pnpm.io/supply-chain-security).

# Only install versions published at least 7 days ago (in minutes), so a
# compromised release is usually caught and pulled before it reaches us; the
# same cooldown as Dependabot (`.github/dependabot.yml`). This also applies
# to the weekly update of shadcn/ui (`pnpm shadcn:update`).
minimumReleaseAge: 10080
# TEMPORARY, remove after 2026-10-24: the versions of the lockfile that were
# resolved before pnpm checked the lockfile against `minimumReleaseAge`
# (pnpm 12), all younger than 7 days on 2026-10-18. Exact versions only, so
# that no other version of these packages bypasses the cooldown.
minimumReleaseAgeExclude:
  - "@hono/node-server@2.1.5"
  - "@oxc-project/types@0.154.0"
  - "@playwright/test@1.64.1"
  - "@radix-ui/primitive@1.2.0"
  - "@radix-ui/react-context@1.3.0"
  - "@radix-ui/react-dialog@1.3.1"
  - "@radix-ui/react-dismissable-layer@1.2.1"
  - "@radix-ui/react-focus-guards@1.2.0"
  - "@radix-ui/react-focus-scope@1.3.1"
  - "@radix-ui/react-portal@1.2.0"
  - "@radix-ui/react-primitive@2.2.0"
  - "@radix-ui/react-slot@1.5.0"
  - "@radix-ui/react-use-callback-ref@1.1.5"
  - "@radix-ui/react-use-controllable-state@1.3.0"
  - "@rolldown/binding-android-arm-eabi@1.2.14"
  - "@rolldown/binding-android-arm64@1.2.14"
  - "@rolldown/binding-darwin-arm64@1.2.14"
  - "@rolldown/binding-darwin-x64@1.2.14"
  - "@rolldown/binding-freebsd-x64@1.2.14"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.14"
  - "@rolldown/binding-linux-arm64-gnu@1.2.14"
  - "@rolldown/binding-linux-arm64-musl@1.2.14"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.14"
  - "@rolldown/binding-linux-s390x-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-musl@1.2.14"
  - "@rolldown/binding-openharmony-arm64@1.2.14"
  - "@rolldown/binding-win32-arm64-msvc@1.2.14"
  - "@rolldown/binding-win32-x64-msvc@1.2.14"
  - "@shadcn/registry@0.2.0"
  - "baseline-browser-mapping@2.11.29"
  - "caniuse-lite@1.0.30001816"
  - "cn@0.5.0"
  - "electron-to-chromium@1.5.458"
  - "ip-address@10.7.4"
  - "lucide-react@1.58.0"
  - "node-releases@2.0.59"
  - "playwright@1.64.1"
  - "playwright-core@1.64.1"
  - "postcss@8.5.30"
  - "qs@6.16.1"
  - "react@19.3.1"
  - "react-dom@19.3.1"
  - "react-is@19.3.1"
  - "react-resizable-panels@4.14.5"
  - "rolldown@1.2.14"
  - "shadcn@4.22.0"
  - "undici@7.30.1"
  - "zod@4.6.7"

# Fail when a package loses the provenance or trusted publisher it had in
# earlier versions, a sign that its publishing was taken over.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A security backport to the 6.x line, published after 7.x releases that
  # had provenance: older line, not a takeover (like the site).
  - semver@6.3.1
  # A dependency of recharts, published by hand by a maintainer in 2024 after
  # 5.1.0 had provenance: not a takeover.
  - reselect@5.1.1

# Transitive dependencies may only come from the registry, not from git
# repositories or tarball URLs.
blockExoticSubdeps: true

# Install scripts are not run, and a new package with one fails the install
# until it is reviewed and listed here.
strictDepBuilds: true

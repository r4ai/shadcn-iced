[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/r4ai/shadcn-iced"
rust-version = "1.88"

[workspace.dependencies]
iced = { version = "0.14", features = ["advanced", "svg", "canvas", "image", "tokio"] }
iced_test = "0.14"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

# The live previews of the website (`site/scripts/build-wasm.mjs`).
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
